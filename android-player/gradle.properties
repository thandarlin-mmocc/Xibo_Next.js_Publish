android.useAndroidX=true
kotlin.code.style=official

# Baked in at build time - an installed APK on a TV box has no env var to
# read at runtime, unlike the Windows Electron shell. Point this at the real
# deployed CMS URL before building a release; both platforms load the exact
# same /player web page from here.
PLAYER_BASE_URL=https://your-cms-domain.example.com
